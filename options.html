<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daybeam settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="standalone-page">
  <main class="standalone-card">
    <a class="brand" href="popup.html">
      <img src="icons/48.png" alt="" width="38" height="38">
      <span><strong>daybeam</strong><small>your day, in view</small></span>
    </a>
    <h1>Make it yours</h1>
    <p>Choose how Daybeam fits into your day. Your settings are stored in this browser.</p>
    <div class="settings-grid">
      <label class="setting-row"><span><strong>Default calendar view</strong><small>Open to the view you use most.</small></span><select id="default-view"><option value="agenda">Agenda</option><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="month-scroll">Month Scroll</option><option value="year">Year</option></select></label>
      <label class="setting-row"><span><strong>Remind me before events</strong><small>Daybeam checks for upcoming events while Chrome is running.</small></span><select id="reminder-minutes"><option value="0">At start time</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></label>
      <label class="setting-row"><span><strong>Desktop reminders</strong><small>Show a notification you can snooze for five minutes.</small></span><input id="notifications" type="checkbox"></label>
      <label class="setting-row"><span><strong>Speak reminders aloud</strong><small>Read the event title when a reminder appears.</small></span><input id="voice" type="checkbox"></label>
      <label class="setting-row"><span><strong>Next event on the icon</strong><small>Show a short countdown on the toolbar button.</small></span><input id="show-badge" type="checkbox"></label>
    </div>
    <div class="settings-actions"><button id="disconnect-button" class="today-button" type="button">Disconnect Google</button><span id="settings-status" class="settings-status" aria-live="polite"></span></div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
